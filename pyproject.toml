[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[project]
name = "pyglue"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tk", email = "tk" }
]
requires-python = ">=3.13"
dependencies = [
    "maturin>=1.14.1",
]
dynamic = ["version"]

[project.scripts]
pyglue = "pyglue:main"

[dependency-groups]
dev = [
    "pandas>=3.0.5",
    "pytest>=9.1.1",
]
